<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Demandas e Moradores</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <div class="container">
        <section class="card">
            <h2>Lista de Demandas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Tipo</th>
                            <th>Endereço</th>
                            <th>Status</th>
                            <th>Finalizar</th>
                            <th>Excluir</th>
                        </tr>
                    </thead>
                    <tbody id="demandas-tbody">
                        <tr><td colspan="4">Carregando demandas...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="card">
            <h2>Cadastrar Nova Demanda</h2>
            <form id="demandaForm">
                <fieldset>
                    <legend>Morador</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Ex: Maria Souza" required>
                        </div>
                        <div class="form-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(21) 99999-9999" required>
                        </div>
                        <div class="form-group">
                            <label for="resident-street">Rua</label>
                            <input type="text" id="resident-street" name="resident-street" placeholder="Rua" required>
                        </div>
                        <div class="form-group">
                            <label for="resident-district">Bairro</label>
                            <input type="text" id="resident-district" name="resident-district" placeholder="Bairro" required>
                        </div>
                        <div class="form-group">
                            <label for="resident-city">Cidade</label>
                            <select id="resident-city" name="resident-city" required disabled>
                                <option value="">Selecione um estado primeiro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="resident-state">Estado</label>
                            <select id="resident-state" name="resident-state" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Demanda</legend>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="title">Título</label>
                            <input type="text" id="title" name="title" placeholder="Resumo da solicitação" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="description">Descrição</label>
                            <textarea id="description" name="description" placeholder="Detalhes da demanda..." required></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label for="demandType">Tipo de Demanda</label>
                            <select id="demandType" name="demandType" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="demand-street">Rua</label>
                            <input type="text" id="demand-street" name="demand-street" placeholder="Rua" required>
                        </div>
                        <div class="form-group">
                            <label for="demand-district">Bairro</label>
                            <input type="text" id="demand-district" name="demand-district" placeholder="Bairro" required>
                        </div>
                        <div class="form-group">
                            <label for="demand-city">Cidade</label>
                            <select id="demand-city" name="demand-city" required disabled>
                                <option value="">Selecione um estado primeiro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="demand-state">Estado</label>
                            <select id="demand-state" name="demand-state" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <button type="submit" class="btn-submit">Enviar Demanda</button>
            </form>
        </section>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
